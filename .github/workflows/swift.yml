name: Build WinKeys for macOS

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: Test
    runs-on: macos-14

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Run tests
        run: |
          xcodebuild \
            -project WinKeys.xcodeproj \
            -scheme WinKeys \
            -configuration Debug \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            test

  build:
    name: Build ${{ matrix.name }} DMG
    needs: test
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            name: Apple-Silicon
          - arch: x86_64
            name: Intel

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Build Release app
        run: |
          set -euo pipefail
          xcodebuild \
            -project WinKeys.xcodeproj \
            -scheme WinKeys \
            -configuration Release \
            -sdk macosx \
            -destination 'generic/platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/WinKeysDerivedData" \
            ARCHS='${{ matrix.arch }}' \
            ONLY_ACTIVE_ARCH=YES \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Ad-hoc sign app
        run: |
          set -euo pipefail
          app="$RUNNER_TEMP/WinKeysDerivedData/Build/Products/Release/WinKeys.app"
          codesign \
            --force \
            --deep \
            --sign - \
            --identifier com.oxygen.WinKeys \
            "$app"
          codesign --verify --deep --strict --verbose=2 "$app"

      - name: Create DMG
        run: |
          set -euo pipefail
          app="$RUNNER_TEMP/WinKeysDerivedData/Build/Products/Release/WinKeys.app"
          staging="$RUNNER_TEMP/WinKeysDmg"
          dmg="dist/WinKeys-${{ matrix.name }}.dmg"
          mkdir -p "$staging" dist
          ditto "$app" "$staging/WinKeys.app"
          ln -s /Applications "$staging/Applications"
          hdiutil create \
            -volname "WinKeys ${{ matrix.name }}" \
            -srcfolder "$staging" \
            -ov \
            -format UDZO \
            "$dmg"

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: WinKeys-${{ matrix.name }}
          path: dist/WinKeys-${{ matrix.name }}.dmg
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download DMGs
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" \
            dist/WinKeys-Apple-Silicon.dmg \
            dist/WinKeys-Intel.dmg \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
